[agent]
name = "hello-world"
description = "Smoke-test agent. Confirms Verona's pipes are connected end-to-end."
adapter = "claude-cli"
default_effort = "low"

[soul]
file = "./SOUL.md"

[memory]
index = "./memory/INDEX.md"
self_learning = true
episodic_retention_days = 7
working_retention_days = 1

[connectors]

[[tasks]]
id = "greet"
prompt = "./tasks/greet.md"
schedule = "0 9 * * *"
effort = "low"
# Without an allowed_tools list, `claude -p` denies non-default tools (Write,
# Edit, etc.). The episodic-log step requires Write, so it's listed explicitly.
allowed_tools = ["Read", "Write"]

[[tasks]]
id = "guard-test"
prompt = "./tasks/guard-test.md"
schedule = "0 0 1 1 *"     # Jan 1 yearly — effectively manual-only
effort = "low"
allowed_tools = ["Read", "Write", "Edit"]
