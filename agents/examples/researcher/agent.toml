[agent]
name = "researcher"
description = "Scans the web nightly for trends in AI coding tools, posts a digest to Slack, and answers follow-ups in thread."
adapter = "claude-cli"
default_effort = "medium"

[soul]
file = "./SOUL.md"

[memory]
index = "./memory/INDEX.md"
self_learning = true
episodic_retention_days = 60
working_retention_days = 7

[connectors]
# Replace `#research-feed` with the actual channel id or "#name" for your workspace.
slack = { channel = "#research-feed" }

[[tasks]]
id = "nightly-scan"
prompt = "./tasks/nightly-scan.md"
schedule = "0 3 * * *"
effort = "high"
# WebSearch finds pages by topic; WebFetch reads a specific URL. A research
# task usually needs both: search to discover candidates, fetch to read the
# primary source. Read/Write are for memory I/O.
allowed_tools = ["Read", "Write", "WebFetch", "WebSearch"]

# Slack thread replies don't need a separate task. When you @-mention this
# agent in the channel where it posted a digest, the daemon resumes the same
# `claude -p` session and your message becomes the next turn — the agent
# already has the original task prompt + its response in context. The SOUL.md
# tells it how to behave for follow-ups (re-fetch sources, stay terse, cite).
#
# Add a `[[tasks]] on_message = true` block here only if you want a strict
# inbound-message protocol (e.g. a triage prompt that runs on every reply).
