[agent]
name = "researcher"
description = "Scans the web nightly for trends in AI coding tools, posts a digest to Slack, and answers follow-ups in thread."
adapter = "claude-cli"
default_effort = "medium"
# Skills the agent can call via the Skill tool at runtime. Each name must
# match a directory at `~/.verona/user/skills/<name>/` containing a SKILL.md.
# Verona stages declared skills into the per-run dir so `claude -p` discovers
# them as project-local. Remove this line if you have no skills.
# skills = ["copywriting"]

[soul]
file = "./SOUL.md"

[memory]
index = "./memory/INDEX.md"
self_learning = true
episodic_retention_days = 60
working_retention_days = 7

[connectors]
# Replace `#research-feed` with the actual channel id or "#name" for your workspace.
# Subscribing here automatically exposes `mcp__verona__slack__send_message` and
# `mcp__verona__slack__upload_attachment` to the agent.
slack = { channel = "#research-feed" }

[[tasks]]
id = "nightly-scan"
prompt = "./tasks/nightly-scan.md"
schedule = "0 3 * * *"
effort = "high"
# WebSearch finds pages by topic; WebFetch reads a specific URL. A research
# task usually needs both: search to discover candidates, fetch to read the
# primary source. Read/Write are for memory I/O. The dispatcher extends
# allowed_tools with `mcp__verona__*` automatically when [connectors.*]
# blocks are set, so you don't need to list slack tools here.
allowed_tools = ["Read", "Write", "WebFetch", "WebSearch"]

# How follow-ups work — no separate `on_message` task needed:
#
#   1. The cron task posts a digest via slack__send_message. The returned
#      message ts is anchored to this run's claude -p session id.
#   2. A user reply in that thread (with or without an @-mention) lands as
#      an inbound event. The daemon looks up the thread anchor and resumes
#      the same session — the user message becomes the next turn.
#   3. The agent's SOUL drives reply behavior (re-fetch sources, stay terse,
#      cite). It calls slack__send_message again, this time with thread_ts
#      set, to reply inside the thread.
#
# Add a `[[tasks]] on_message = true` block only if you want a strict
# inbound-message protocol (e.g. a triage prompt that runs on every reply).
